[project]
name = "deribridge"
version = "1.0.0"
description = "Async, typed multi-exchange bridge: structured data and a common interface across crypto exchanges (Deribit, Binance, ...)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Francesco Casamassima", email = "dev@elnc.eu" }
]
keywords = [
    "deribit",
    "binance",
    "crypto",
    "cryptocurrency",
    "trading",
    "derivatives",
    "options",
    "futures",
    "multi-exchange",
    "exchange-adapter",
    "portfolio-analytics",
    "deribook",
    "async",
    "asyncio",
    "websocket",
    "api-client",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
# Core depends only on what the shared framework needs (canonical models +
# credential loading). Each exchange adapter's third-party transport deps are
# gated behind an extra and imported lazily — adapter *code* always ships, only
# its dependencies are optional.
dependencies = [
    "python-dotenv>=1.2.2",
    "pydantic>=2.11.5",
]

[project.optional-dependencies]
# Deribit speaks WebSocket JSON-RPC only.
deribit = [
    "websockets>=15.0.1",
]
# Binance uses REST (httpx) plus WebSocket streams.
binance = [
    "httpx>=0.27",
    "websockets>=15.0.1",
]
# Install every bundled adapter's dependencies. Self-referential so the lists
# above stay the single source of truth.
all = [
    "deribridge[deribit]",
    "deribridge[binance]",
]

[project.urls]
Homepage = "https://github.com/fracasamax/deribridge"
Repository = "https://github.com/fracasamax/deribridge"
Issues = "https://github.com/fracasamax/deribridge/issues"
"Analytics (deribook)" = "https://deribook.com"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deribridge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    # All adapter transport deps, so `uv run pytest` exercises the whole suite
    # (end users still get these gated behind the per-exchange extras).
    "websockets>=15.0.1",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
# The pydantic plugin teaches mypy that Field(default=...) provides a default,
# so models constructed across module boundaries don't report spurious
# "missing named argument" errors.
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
